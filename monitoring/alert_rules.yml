groups:
  - name: brainbytes-alerts
    rules:
      - alert: BackendDown
        expr: up{job="brainbytes-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BrainBytes backend is down"
          description: "Prometheus cannot scrape the BrainBytes backend metrics endpoint."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="brainbytes-backend"} > 300000000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High backend memory usage"
          description: "Backend memory usage is above 300MB."

      - alert: SlowAIResponses
        expr: rate(brainbytes_ai_response_duration_seconds_sum[5m]) / rate(brainbytes_ai_response_duration_seconds_count[5m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow AI responses"
          description: "Average AI response time is above 3 seconds."